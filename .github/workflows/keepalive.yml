name: keepalive
# GitHub pauses scheduled workflows after 60 days without repository activity.
# This writes a one-line timestamp once a month so the market schedule keeps running.
on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%MZ > .keepalive
          git config user.name "jarvis-keepalive"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" && git push || true
